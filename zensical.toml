# Project information
[project]
site_name = "Knotis"
site_url = "https://ttezcann.github.io/knotis-docs"
docs_dir = "docs"
site_dir = "site"

# Repository
repo_url = "https://github.com/ttezcann/knotis-docs"
repo_name = "knotis-docs"
edit_uri = "edit/main/docs/"

# Site tree
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "What is Knotis?" = "getting-started/what-is-knotis.md" },
    { "Install Knotis" = "getting-started/install-knotis.md" },
    { "Author the site" = "getting-started/author-the-site.md" },
    { "Publish the site" = "getting-started/publish-the-site.md" },
  ] },
  { "Features" = [
    { "Outlining" = "features/outlining-feature.md" },
    { "Wikilinks" = "features/wikilinks-feature.md" },
    { "Pane" = "features/pane-feature.md" },
    { "Graphs" = "features/graphs-feature.md" },
    { "Content tags" = "features/content-tags-feature.md" },
    { "Glossary" = "features/glossary-feature.md" },
    { "Slide mode" = "features/slide-mode-feature.md" },
    { "Search" = "features/search-feature.md" },
    { "Read aloud" = "features/read-aloud-feature.md" },
    { "Video controls" = "features/video-controls-feature.md" },
  ] },
  { "Explore" = [
    { "Site graph" = "explore/site-graph.md" },
    { "Glossary" = "explore/glossary.md" },
    { "Content tags" = "explore/content-tags.md" },
  ]},
  { "Changelog" = [
    { "Changelog" = "changelog/changelog.md" },
  ]},
]

# Knotis settings
## Content
[project.extra.knotis.content]
heading_numbering = true
heading_guides = true
generator = true
styled_section_groups = true

## Wikilinks
[project.extra.knotis.wikilinks]
default = "#0197a7"
slate = "#fda4af"

## Pane
[project.extra.knotis.pane]
width = 750
initial_lines = 12
initial_list_items = 20
chunk_lines = 4
order = []

### Pane path
[project.extra.knotis.pane.path]
enabled = true
include_paths = []
exclude_paths = []

## Graphs
### Site graph
[project.extra.knotis.site_graph.graph]
enabled = true
default_view = "all"
exclude_tags = []
exclude_paths = []
exclude_wikilinks = []

### Page graph
[project.extra.knotis.page_graph.graph]
enabled = true
exclude_paths = []
exclude_wikilinks = []

### Concept graph
[project.extra.knotis.concept_graph.graph]
enabled = true
exclude_paths = []
exclude_wikilinks = []

## Content tags
[project.extra.knotis.content_tags]
enabled = true
nav_chips = true
order = ["settings", "tip"]

[project.extra.knotis.content_tags.colors.default]
settings = "#067647"
tip = "#b45309"

[project.extra.knotis.content_tags.colors.slate]
settings = "#79d7a7"
tip = "#ffbf7d"

## Glossary
[project.extra.knotis.glossary]
enabled = true
default_view = "by_page"
page_view_label = "Pages"
exclude_paths = []
order = []

## Slide mode
[project.extra.knotis.slides]
enabled = true
include_paths = ["features/slide-mode-feature.md","features/video-controls-feature.md"]
exclude_paths = []
fit_min_font_px = 26
fit_max_font_px = 42
content_fill = 0.99
content_inset = [2, 2, 2, 2]

## Search
[project.extra.knotis.search]
enabled = true
exclude_paths = []
exclude_wikilinks = []
order = []

## Read Aloud
[project.extra.knotis.readaloud]
enabled = true

# Zensical settings
## Theme settings
[project.theme]
custom_dir = "overrides"
variant = "modern"
font = false
primary = "indigo"
accent = "indigo"
logo = "assets/attachments/0-logo/knotis-mark.svg"
features = [
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.expand",
  "navigation.indexes",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.tabs.link",
  "content.action.view",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

## Markdown extensions
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.sane_lists]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.abbr]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.critic]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["overrides/.icons"]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
